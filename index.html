<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ActProbe: Action-Space Probe for Early Failure Detection of Generative Robot Policies</title>
  <meta name="description" content="ActProbe is a lightweight, pure action-space probe that anticipates failures of generative robot policies before they become visually recognizable.">

  <!-- Bulma + icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#1d2433; --muted:#5b6677; --line:#e7eaf0;
      --accent:#15803d;            /* ActProbe green */
      --accent-soft:#e8f3ec;
      --accent-2:#c47d80;          /* muted red (baselines) */
      --blue:#8bb5d6;
      --bg:#ffffff; --bg-soft:#f7f9fb;
    }
    html{scroll-behavior:smooth;}
    body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}
    .serif{font-family:'Newsreader',Georgia,serif;}
    .section{padding:3.2rem 1.5rem;}
    .container{max-width:960px;}
    .tight{max-width:820px;margin-inline:auto;}

    /* hero */
    .hero-head{position:relative;overflow:hidden;background:linear-gradient(180deg,#f3f7f4 0%,#ffffff 100%);border-bottom:1px solid var(--line);}
    .hero-dots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
    .hero-head>.section{position:relative;z-index:1;}
    .title-main{font-weight:800;letter-spacing:0;line-height:1.12;color:var(--ink);font-size:2.45rem;}
    .title-main .brand{color:var(--accent);}
    .title-main .title-line{display:block;}
    .line{display:block;}
    .subtitle-main{color:var(--muted);font-weight:500;margin-top:.6rem;font-size:1.05rem;}
    .authors{margin-top:1.4rem;line-height:2;}
    .authors a{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent-soft);}
    .authors a:hover{border-color:var(--accent);}
    .sup{color:var(--accent);font-weight:700;font-size:.8em;}
    .affil{color:var(--muted);font-size:.92rem;margin-top:.6rem;line-height:1.7;}
    .notes{color:var(--muted);font-size:.85rem;margin-top:.3rem;}

    /* link buttons */
    .links{margin-top:1.6rem;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;}
    .btn-pill{display:inline-flex;align-items:center;gap:.5rem;background:var(--ink);color:#fff;border-radius:999px;padding:.55rem 1.15rem;font-weight:600;font-size:.95rem;transition:transform .12s ease, background .12s ease;}
    .btn-pill:hover{transform:translateY(-2px);background:#000;color:#fff;}
    .btn-pill.alt{background:var(--accent);}
    .btn-pill.alt:hover{background:#0f6c33;}
    .btn-pill.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
    .btn-pill.ghost:hover{background:var(--bg-soft);color:var(--ink);}
    .btn-pill.disabled{background:var(--bg-soft);color:#9aa0a6;border:1px solid var(--line);pointer-events:none;cursor:default;}
    .btn-pill.disabled:hover{transform:none;}

    h2.sec{font-weight:800;font-size:1.7rem;letter-spacing:0;text-align:center;margin:0 auto 1.7rem;width:fit-content;max-width:820px;}
    h2.sec::after{content:"";display:block;width:56px;height:3px;background:var(--accent);border-radius:3px;margin:.45rem auto 0;}

    .lead{font-size:1.06rem;line-height:1.8;color:#37414f;}
    .lead .hl{background:linear-gradient(transparent 60%, var(--accent-soft) 60%);font-weight:600;color:var(--ink);}

    figure.fig{margin:0 auto;}
    figure.fig.narrow{max-width:760px;}
    .teaser-container{max-width:1160px;}
    .teaser-section{padding-top:2.4rem;padding-bottom:0;}
    figure.fig.teaser{max-width:864px;}
    figure.fig img{border-radius:8px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,30,50,.055);width:100%;background:#fff;box-sizing:border-box;}
    figure.fig.plot img{padding:10px;}
    figure.fig figcaption{color:var(--muted);font-size:.9rem;margin-top:.8rem;line-height:1.6;}
    figcaption b{color:var(--ink);}
    figure.fig video{width:100%;border-radius:8px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,30,50,.055);background:#fff;}
    .rollout-band{margin:2rem calc(50% - 50vw) 0;padding:2rem 1.5rem 2.2rem;background:var(--bg-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
    figure.fig.teaser-rollouts{width:min(1440px,calc(100vw - 3rem));max-width:none;margin:0 auto;}
    .wide-video-scroll{overflow-x:auto;padding-bottom:.25rem;}
    .wide-video-scroll video{display:block;min-width:920px;}
    .fig-videos{display:flex;flex-direction:column;gap:2rem;margin:1.8rem auto 0;max-width:820px;}
    .fig-videos figure.fig{max-width:820px;}

    /* stat cards */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;}
    @media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr);}}
    .stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.2rem 1rem;text-align:center;}
    .stat .num{font-weight:800;font-size:1.9rem;color:var(--accent);letter-spacing:0;}
    .stat .lab{color:var(--muted);font-size:.85rem;margin-top:.3rem;line-height:1.4;}

    /* signal chips */
    .signals{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.4rem;}
    @media(max-width:768px){.signals{grid-template-columns:1fr;}}
    .signal{border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.2rem;background:#fff;}
    .signal .tag{display:inline-block;font-weight:700;color:var(--accent);font-size:.8rem;letter-spacing:0;text-transform:uppercase;}
    .signal h4{font-weight:700;margin:.3rem 0 .4rem;font-size:1.08rem;}
    .signal p{color:var(--muted);font-size:.95rem;line-height:1.6;}

    .table-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.75fr);gap:1.2rem;align-items:start;margin-top:1.5rem;}
    .table-block{background:transparent;border:0;border-radius:0;overflow:visible;box-shadow:none;}
    .table-title{margin:1.25rem auto .6rem;max-width:880px;text-align:center;font-size:.94rem;line-height:1.45;color:#303947;}
    .table-scroll{overflow-x:auto;padding-bottom:.25rem;}
    table.paper-table{width:auto;min-width:0;margin:0 auto;border-collapse:collapse;font-size:1.06rem;white-space:nowrap;border-top:2px solid #1f2937;border-bottom:2px solid #1f2937;background:#fff;}
    table.paper-table th,table.paper-table td{padding:.28rem .32rem;border-bottom:0;text-align:center;}
    table.paper-table th:first-child,table.paper-table td:first-child{text-align:left;font-weight:700;color:var(--ink);}
    table.paper-table thead th{background:transparent;color:var(--ink);font-weight:700;}
    table.paper-table thead tr:last-child th,table.paper-table thead th[rowspan]{border-bottom:1.5px solid #1f2937;}
    table.paper-table th[colspan]{text-align:center;}
    table.paper-table .stack{display:inline-block;line-height:1.15;}
    table.paper-table thead tr:first-child th:not(:first-child){border-left:1px solid #8d96a3;}
    table.paper-table thead tr:last-child th:nth-child(1),
    table.paper-table thead tr:last-child th:nth-child(3),
    table.paper-table thead tr:last-child th:nth-child(5),
    table.paper-table thead tr:last-child th:nth-child(7),
    table.paper-table thead tr:last-child th:nth-child(9),
    table.paper-table tbody td:nth-of-type(1),
    table.paper-table tbody td:nth-of-type(3),
    table.paper-table tbody td:nth-of-type(5),
    table.paper-table tbody td:nth-of-type(7),
    table.paper-table tbody td:nth-of-type(9){border-left:1px solid #8d96a3;}
    table.paper-table .best{color:var(--ink);font-weight:800;}
    table.paper-table .second{text-decoration:underline;text-underline-offset:3px;}
    table.paper-table .dash{color:#98a1ad;}
    table.paper-table .ours th,table.paper-table .ours td{background:#eef2f5;font-weight:800;}
    table.paper-table .baseline th,table.paper-table .baseline td{border-top:1.5px solid #1f2937;}
    .main-table{margin-top:1.4rem;}
    .soft{background:var(--bg-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

    pre.bib{background:#f5f7fa;color:#1d2433;border:1px solid var(--line);border-radius:8px;padding:1.2rem 1.3rem;overflow:auto;font-size:.85rem;line-height:1.55;}
    .sim-figs figure.fig{margin:0 auto;}
    .sim-figs figure.fig.photo{max-width:380px;}
    .sim-figs figure.fig.plot{max-width:450px;}
    .sim-figs figure.fig img{max-height:320px;max-width:100%;width:auto;margin:0 auto;display:block;}
    .sim-figs figure.fig figcaption{text-align:center;margin-left:auto;margin-right:auto;}
    footer{padding:2.5rem 1.5rem;color:var(--muted);font-size:.85rem;text-align:center;border-top:1px solid var(--line);}
    footer a{color:var(--accent);}
    .badge-eyebrow{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:0;text-transform:uppercase;padding:.3rem .8rem;border-radius:999px;}
    @media(max-width:768px){
      .section{padding:2.5rem 1rem;}
      .title-main{font-size:2rem;}
      .lead{font-size:1rem;}
      .table-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

  <!-- ================= HERO ================= -->
  <header class="hero-head">
    <canvas class="hero-dots" aria-hidden="true"></canvas>
    <div class="section" style="padding-top:3.4rem;padding-bottom:2.4rem;">
      <div class="container has-text-centered">
        <span class="badge-eyebrow">Preprint &middot; Failure Detection for Robot Policies</span>
        <h1 class="title-main serif" style="margin-top:1rem;">
          <span class="title-line">Accelerate Physical Intelligence Scaling: Self-Evolving Physical Agent and Fast Rollout Infrastructure</span>
        </h1>
        <!-- links -->
        <div class="links">
          <a class="btn-pill" href="javascript:void(0)" rel="noopener"><i class="ai ai-arxiv"></i>&nbsp;arXiv</a>
          <a class="btn-pill ghost" href="javascript:void(0)" rel="noopener"><i class="fab fa-github"></i> Code</a>
          <a class="btn-pill ghost" href="javascript:void(0)"><i class="fas fa-quote-right"></i> BibTeX</a>
        </div>
      </div>
    </div>
  </header>

  <script>
    (() => {
      const canvas = document.querySelector(".hero-dots");
      const hero = document.querySelector(".hero-head");
      if (!canvas || !hero) return;

      const ctx = canvas.getContext("2d");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const pointer = { x: -1000, y: -1000, active: false };
      let dots = [];
      let width = 0;
      let height = 0;
      let dpr = 1;
      let raf = 0;
      let visible = true;

      const buildDots = () => {
        const rect = hero.getBoundingClientRect();
        width = Math.max(1, Math.round(rect.width));
        height = Math.max(1, Math.round(rect.height));
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const spacing = width < 700 ? 34 : 40;
        dots = [];
        for (let y = spacing * 0.5; y < height; y += spacing) {
          for (let x = spacing * 0.5; x < width; x += spacing) {
            const jitterX = ((x * 17 + y * 13) % 11) - 5;
            const jitterY = ((x * 7 + y * 19) % 11) - 5;
            dots.push({ x: x + jitterX, y: y + jitterY });
          }
        }
      };

      const draw = () => {
        ctx.clearRect(0, 0, width, height);
        const radius = width < 700 ? 105 : 145;

        dots.forEach((dot) => {
          const dx = pointer.x - dot.x;
          const dy = pointer.y - dot.y;
          const distance = Math.hypot(dx, dy);
          const influence = pointer.active && !reducedMotion ? Math.max(0, 1 - distance / radius) : 0;
          const pull = influence * influence * 14;
          const angle = Math.atan2(dy, dx);
          const x = dot.x + Math.cos(angle) * pull;
          const y = dot.y + Math.sin(angle) * pull;
          const size = 1.15 + influence * 1.45;

          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(21,128,61,${0.10 + influence * 0.26})`;
          ctx.fill();
        });

        if (!reducedMotion && visible) {
          raf = requestAnimationFrame(draw);
        }
      };

      const start = () => {
        cancelAnimationFrame(raf);
        draw();
      };

      const updatePointer = (event) => {
        const rect = hero.getBoundingClientRect();
        pointer.x = event.clientX - rect.left;
        pointer.y = event.clientY - rect.top;
        pointer.active = pointer.x >= 0 && pointer.x <= rect.width && pointer.y >= 0 && pointer.y <= rect.height;
      };

      buildDots();
      start();

      hero.addEventListener("pointermove", updatePointer);
      hero.addEventListener("pointerleave", () => {
        pointer.active = false;
      });
      window.addEventListener("resize", () => {
        buildDots();
        start();
      });

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          visible = entries.some((entry) => entry.isIntersecting);
          if (visible) start();
          else cancelAnimationFrame(raf);
        });
        observer.observe(hero);
      }
    })();

    (() => {
      const counters = document.querySelectorAll("[data-countup-target]");
      if (!counters.length) return;

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      const render = (el, value) => {
        const decimals = Number(el.dataset.countupDecimals || 0);
        const prefix = el.dataset.countupPrefix || "";
        const suffix = el.dataset.countupSuffix || "";
        const number = decimals > 0 ? value.toFixed(decimals) : Math.round(value).toString();
        el.textContent = `${prefix}${number}${suffix}`;
      };

      const animate = (el) => {
        if (el.dataset.countupDone === "true") return;
        el.dataset.countupDone = "true";

        const target = Number(el.dataset.countupTarget || 0);
        if (reducedMotion) {
          render(el, target);
          return;
        }

        const duration = 1650;
        const start = performance.now();
        render(el, 0);

        const tick = (now) => {
          const progress = Math.min(1, (now - start) / duration);
          render(el, target * easeOutCubic(progress));
          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            render(el, target);
          }
        };

        requestAnimationFrame(tick);
      };

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            animate(entry.target);
            observer.unobserve(entry.target);
          });
        }, { threshold: 0.45 });

        counters.forEach((el) => observer.observe(el));
      } else {
        counters.forEach(animate);
      }
    })();
  </script>

</body>
</html>
